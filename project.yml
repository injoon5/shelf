name: Shelf
options:
  bundleIdPrefix: dev.ij5
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Shelf.xcconfig
  Release: Config/Shelf.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
packages:
  # Shelf's own Kiln, forked from upstream 0.2.1 (see Packages/Kiln/README.md).
  Kiln:
    path: Packages/Kiln
targets:
  Shelf:
    type: application
    platform: iOS
    sources:
      - path: Shelf
        excludes: ["Resources/Prompts"]
      - path: Shelf/Resources/Prompts
        type: folder
        buildPhase: resources
      # What Kiln runs: the prompt's "What works" and "What doesn't work" (PromptCatalog).
      - path: Packages/Kiln/kiln-manifest.json
        buildPhase: resources
    dependencies:
      - package: Kiln
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ij5.shelf
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    info:
      path: Shelf/Info.plist
      properties:
        CFBundleDisplayName: Shelf
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Without it an iPhone app's animations stop at 60 Hz on ProMotion.
        CADisableMinimumFrameDurationOnPhone: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        # iOS asks once for Shelf; Shelf asks first for each app (PLAN.md §4.0,
        # Shelf/Permissions). The photo picker needs no string.
        NSCameraUsageDescription: So apps on your Shelf can take photos and videos. Each app asks you first.
        NSMicrophoneUsageDescription: So apps on your Shelf can record sound. Each app asks you first.
        NSMotionUsageDescription: So apps on your Shelf can read your steps and activity. Each app asks you first.
        NSLocationWhenInUseUsageDescription: So apps on your Shelf can see where you are while they’re open. Each app asks you first.
        NSPhotoLibraryAddUsageDescription: So apps on your Shelf can save photos and videos to your library. Each app asks you first.
        # Lets the site URL point at a dev server on this Mac or the LAN.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  ShelfTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ShelfTests
      - path: fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Shelf
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.ij5.shelf.tests
schemes:
  Shelf:
    build:
      targets:
        Shelf: all
        ShelfTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [ShelfTests]
